name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Job names are required status checks on main ("test (18)" …) — renaming
  # the job or adding a matrix axis leaves them unreported and blocks merges.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm test
      - run: node src/doctor.js

  # Hooks run under `sh -c`: dash on Ubuntu, bash on macOS. The end-to-end
  # tests drive hooks.json through both — read dedup once broke on dash only.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
      - run: node src/doctor.js

  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Fails if package.json, plugin.json, marketplace.json or the docs badge
      # disagree. marketplace.json shipped two releases stale before this ran.
      - run: node scripts/sync-version.js --check
