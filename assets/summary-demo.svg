      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect width="700" height="260" rx="10" fill="url(#sbg)"/>
  <rect x="1" y="1" width="698" height="258" rx="9" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- Terminal header -->
  <rect x="0" y="0" width="700" height="32" rx="10" fill="#1c2128"/>
