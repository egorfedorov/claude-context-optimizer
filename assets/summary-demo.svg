  <rect x="22" y="76" width="656" height="34" rx="6" fill="#12261a" stroke="#238636" stroke-width="1"/>
  <text x="32" y="98" font-family="SF Mono, monospace" font-size="14" font-weight="700" fill="#3fb950">★ CCO saved $654.36 this session — 86% of what it would have cost.</text>

  <text x="30" y="136" font-family="SF Mono, monospace" font-size="13" fill="#c9d1d9">Tracked 478.9K tokens this session ($102.99).</text>
  <text x="30" y="160" font-family="SF Mono, monospace" font-size="13" fill="#c9d1d9">Prompt cache: <tspan fill="#3fb950">99% hit rate</tspan> saved <tspan fill="#3fb950">$654.36</tspan> vs uncached pricing.</text>
  <text x="30" y="184" font-family="SF Mono, monospace" font-size="13" fill="#d29922">⚠ Cache broke 9x (692.2K re-written, ~$3.98 extra). Common causes: &gt;5 min</text>
